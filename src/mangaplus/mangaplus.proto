// MangaPlus web API (jumpg-webapi.tokyo-cdn.com/api) response schema.
//
// The API dropped its `format=json` mode (now 403) and only serves
// application/x-protobuf. Field numbers below were derived empirically by
// `protoc --decode_raw` against live responses of:
//   title_detailV3, title_list/allV2, title_list/updated, web/web_homeV4,
//   manga_viewer
// Field *names* are chosen so google.protobuf.json_format.MessageToDict
// produces the same camelCase keys the old JSON API returned (e.g.
// start_time_stamp -> startTimeStamp). Renaming a field changes the parsed
// dict keys — keep them in sync with mangaplus.py.
//
// Regenerate with:
//   protoc --python_out=. mangaplus.proto

syntax = "proto3";

package mangaplus;

enum Language {
    ENGLISH = 0;
    SPANISH = 1;
    FRENCH = 2;
    INDONESIAN = 3;
    PORTUGUESE_BR = 4;
    RUSSIAN = 5;
    THAI = 6;
    GERMAN = 7;
    UNKNOWN_LANGUAGE_8 = 8;  // unobserved in live data; placeholder
    VIETNAMESE = 9;
}

message TransitionAction {
    int32 method = 1;
    string url = 2;
}

message Banner {
    string image_url = 1;
    TransitionAction action = 2;
    uint32 id = 3;
}

message Title {
    uint32 title_id = 1;
    string name = 2;
    string author = 3;
    string portrait_image_url = 4;
    string landscape_image_url = 5;
    uint32 view_count = 6;
    Language language = 7;
}

message Chapter {
    uint32 title_id = 1;
    uint32 chapter_id = 2;
    string name = 3;       // chapter number, e.g. "#001"
    string sub_title = 4;  // chapter title, e.g. "Chapter 1: Romance Dawn"
    string thumbnail_url = 5;
    uint32 start_time_stamp = 6;
    uint32 end_time_stamp = 7;
    bool already_viewed = 8;
    bool is_vertical_only = 9;
    uint32 view_count = 13;
    uint32 comment_count = 14;
}

// title_detailV3: chapters come grouped, e.g. group "1200" holds
// mid_chapter_list (older) and last_chapter_list (latest viewable).
message ChapterGroup {
    string chapter_numbers = 1;
    repeated Chapter first_chapter_list = 2;
    repeated Chapter mid_chapter_list = 3;
    repeated Chapter last_chapter_list = 4;
}

message TitleDetailView {
    Title title = 1;
    string title_image_url = 2;
    string overview = 3;
    string background_image_url = 4;
    uint32 next_time_stamp = 5;
    string viewing_period_description = 7;
    string non_appearance_info = 8;
    repeated Banner banners = 11;
    bool is_simul_released = 14;
    int32 rating = 16;
    uint32 number_of_views = 18;
    repeated ChapterGroup chapter_list_group = 28;
}

message MangaPage {
    string image_url = 1;
    uint32 width = 2;
    uint32 height = 3;
    int32 type = 4;
    string encryption_key = 5;
}

message Page {
    MangaPage manga_page = 1;
}

message MangaViewer {
    repeated Page pages = 1;
    uint32 chapter_id = 2;
    repeated Chapter chapters = 3;
    string title_name = 5;
    string chapter_name = 6;
    bool is_vertical_only = 8;
    uint32 title_id = 9;
    bool start_from_right = 10;
}

// title_list/updated
message UpdatedTitle {
    Title title = 1;
    string updated_time_stamp = 2;
}

message TitleUpdatedView {
    repeated UpdatedTitle latest_title = 1;
}

// title_list/allV2: titles grouped by series name across languages.
message AllTitlesGroup {
    string the_title = 1;
    repeated Title titles = 2;
}

message AllTitlesViewV2 {
    repeated AllTitlesGroup all_titles_group = 1;
}

// web/web_homeV4
message UpdatedChapterTitle {
    Title title = 1;
    uint32 chapter_id = 2;
    string chapter_name = 3;
    string chapter_sub_title = 4;
    bool is_latest = 5;
}

message UpdatedTitleV2Group {
    string the_title = 1;
    string chapter_number = 2;
    repeated UpdatedChapterTitle titles = 3;
    uint32 view_count = 4;
    uint32 chapter_start_time = 6;
}

message WebHomeGroup {
    string group_name = 1;
    repeated UpdatedTitleV2Group title_groups = 2;
}

message WebHomeViewV4 {
    repeated Banner top_banners = 1;
    repeated WebHomeGroup groups = 2;
}

message Popup {
    string subject = 1;
    string body = 2;
}

message ErrorResult {
    enum Action {
        DEFAULT = 0;
        UNAUTHORIZED = 1;
        MAINTENANCE = 2;
        GEOIP_BLOCKING = 3;
    }
    Action action = 1;
    Popup english_popup = 2;
    Popup spanish_popup = 3;
    string debug_info = 4;
}

message SuccessResult {
    TitleDetailView title_detail_view = 8;
    MangaViewer manga_viewer = 10;
    TitleUpdatedView title_updated_view = 20;
    AllTitlesViewV2 all_titles_view_v2 = 25;
    WebHomeViewV4 web_home_view_v4 = 38;
}

message Response {
    SuccessResult success = 1;
    ErrorResult error = 2;
}
